ALLOWED_ORIGIN = "https://takuyoshio.github.io"
SUPABASE_URL = "https://swbbslowwklhptqsaixn.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN3YmJzbG93d2tsaHB0cXNhaXhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyMTcwNjcsImV4cCI6MjA5Nzc5MzA2N30.T_7VD3emSP6DbwCpYkhIjO6yRmueuNeXUkldpaGGp3c"

# ユーザーごとのAI利用回数を数えるKV。これが無いと1アカウントで
# Geminiの無料枠を使い切れてしまう。
# 単語カードの写真の語ごとキャッシュ（ph:<語>、30日）も同じKVを使う。
# 未設定だと同じ語で毎回Unsplashを叩くので、50リクエスト/時にすぐ当たる。
# 作成方法:
#   npx wrangler kv namespace create RATE_LIMIT
# 出力された id を下の "" に貼る。バインドしないまま deploy しても
# Workerは動くが、レート制限は無効になる。
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = ""

# Secrets（このファイルには置かず、CLIで登録する）:
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put UNSPLASH_ACCESS_KEY
# UNSPLASH_ACCESS_KEY は未設定でも動く（写真が付かないだけ）。
# キーの取得: https://unsplash.com/oauth/applications で新規アプリを作り、
# Access Key を登録する。Demoモードは50リクエスト/時なのでKVのキャッシュが効く前提。
